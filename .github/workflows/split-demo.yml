name: 'Split Demo Repository'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pkg/demo/**'
      - '.github/workflows/split-demo.yml'

run-name: Repository Split (demo)

concurrency:
  group: 'demo'
  cancel-in-progress: false

jobs:
  filter:
    name: 'Publish Demo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: stelviodev/stelvio
      TARGET_REPOSITORY: stelviodev/demo
      COMMIT_AUTHOR_NAME: 'github-actions[bot]'
      COMMIT_AUTHOR_EMAIL: 'github-actions[bot]@users.noreply.github.com'
    steps:
      - uses: actions/checkout@v4
        with:
          path: origin
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          fetch-depth: 0
          fetch-tags: false
          token: ${{ secrets.PAT_GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          path: target
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: main
          fetch-depth: 0
          fetch-tags: false
          token: ${{ secrets.PAT_GITHUB_TOKEN }}

      - name: Capture target revision
        id: target
        shell: bash
        run: |
          echo "revision=$(git -C target rev-parse refs/heads/main)" >> "$GITHUB_OUTPUT"

      - name: Install git-filter-repo
        run: |
          sudo apt-get update
          sudo apt-get install -y git-filter-repo

      - name: Split repository
        shell: bash
        run: |
          git filter-repo \
            --refs main \
            --path pkg/demo/ \
            --path-rename pkg/demo/: \
            --name-callback 'return os.environ["COMMIT_AUTHOR_NAME"].encode("utf-8")' \
            --email-callback 'return os.environ["COMMIT_AUTHOR_EMAIL"].encode("utf-8")' \
            --commit-callback \
              'commit.message += "\noriginal-commit: https://github.com/{}/commit/{}/".format(os.environ["SOURCE_REPOSITORY"], commit.original_id.decode()).encode("ascii")' \
            --source ./origin \
            --target ./target

      - name: Push changes
        shell: bash
        env:
          TARGET_REVISION: ${{ steps.target.outputs.revision }}
        run: |
          git -C target push \
            --force-with-lease="refs/heads/main:${TARGET_REVISION}" \
            "https://github.com/${TARGET_REPOSITORY}.git" \
            refs/heads/main:refs/heads/main
