[project]
name = "traforo-acceptance-tool"
version = "0.1.0"
description = "Reproducible, local-build acceptance runs for Stelvio and Traforo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click>=8.1,<9", "rich>=13,<15", "boto3>=1.35,<2", "psutil>=6,<8"]

[project.scripts]
traforo-acceptance = "traforo_acceptance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traforo_acceptance"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
